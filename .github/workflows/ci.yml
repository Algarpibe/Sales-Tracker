name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: el pipeline solo lee el repo (typecheck+test+lint+build, sin escritura).
permissions:
  contents: read

# Un solo run por rama/PR: un push nuevo cancela el anterior en curso (INFRA-074).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Gate de dependencias (DEP-021): falla con vulnerabilidades high/critical en
      # el árbol de producción. Las de tooling de desarrollo las vigila Dependabot.
      - name: "Audit (dependencias de producción, high+)"
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      # Los mismos tests unitarios que `npm test`, midiendo cobertura de src/lib y
      # src/actions: falla si baja de los umbrales de vitest.config.ts (TEST-089).
      - name: Test + cobertura (unit; el smoke de integración se salta sin DATABASE_URL)
        run: npm run test:coverage

      - name: "Lint (gate duro: rechaza errores nuevos; react-hooks quedan como warning)"
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # next build fija NEXT_PHASE=phase-production-build, así que el fail-fast de
          # BETTER_AUTH_SECRET se omite. Las páginas son dinámicas (no tocan la BD en build).
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # El service container expone el 5432 estándar, no el 55432 del Compose local.
      E2E_PG_HOST: 127.0.0.1
      E2E_PG_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: "Preparar la BD de E2E (crea ambas bases, migra y siembra)"
        run: npm run e2e:db:reset

      # OJO: este paso NO debe exportar DATABASE_URL. Playwright se lo pasa al
      # servidor Next por el bloque webServer.env de playwright.config.ts. Si se
      # exportara aquí, auth.smoke.test.ts dejaría de saltarse en el job de tests.
      - name: E2E
        run: npx playwright test

      # Smoke de integración de better-auth contra la BD de E2E ya sembrada (TEST-088).
      # Va DESPUÉS de Playwright para no tocar los datos que usan sus specs; el test
      # crea un usuario con email único y lo borra al terminar. DATABASE_URL solo
      # existe en este paso (ver el aviso del paso E2E) y usa postgres, como las
      # semillas: replica APP_URL de e2e/db/config.mjs.
      - name: Smoke de integración (better-auth)
        run: npx vitest run src/lib/auth/__tests__/auth.smoke.test.ts --reporter=verbose
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/salestracker_e2e

      - name: Subir el reporte al fallar
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Construye la imagen de producción (sin publicarla) y la arranca para comprobar
  # el HEALTHCHECK (INFRA-070). La BD apunta a un puerto cerrado a propósito:
  # liveness debe seguir sano y readiness debe degradar a 503 sin filtrar detalles.
  docker:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build de la imagen
        run: docker build -t salestracker:ci .

      - name: Smoke test del contenedor
        run: |
          # Valores de un contenedor efímero de CI: no se usan en ningún sitio real.
          docker run -d --name st-ci -p 3000:3000 \
            -e BETTER_AUTH_SECRET=ci-docker-secret-solo-para-smoke-0123456789 \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e DATABASE_URL=postgres://x:x@127.0.0.1:9/x \
            salestracker:ci

          # Espera a que Docker marque el contenedor como healthy (start-period 30s,
          # interval 30s: el primer chequeo llega a los ~30s).
          status=""
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' st-ci)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            [ "$(docker inspect -f '{{.State.Running}}' st-ci)" = "true" ] || break
            sleep 3
          done
          echo "Estado del HEALTHCHECK: $status"

          ok=1
          [ "$status" = "healthy" ] || { echo "::error::El contenedor no llegó a healthy"; ok=0; }
          curl -fsS http://127.0.0.1:3000/api/health || { echo "::error::liveness falló"; ok=0; }

          code=$(curl -s -o ready.json -w '%{http_code}' 'http://127.0.0.1:3000/api/health?ready=1' || true)
          echo "readiness: HTTP $code $(cat ready.json 2>/dev/null)"

          [ "$code" = "503" ] || { echo "::error::readiness sin BD debía responder 503"; ok=0; }
          if grep -Eqi '127\.0\.0\.1|postgres|ECONNREFUSED' ready.json; then
            echo "::error::readiness filtra detalles de conexión"; ok=0
          fi
          [ "$ok" = "1" ] || { docker logs st-ci; exit 1; }

      - name: Parar el contenedor
        if: always()
        run: docker rm -f st-ci || true
