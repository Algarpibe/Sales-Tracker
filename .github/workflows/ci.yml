name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: el pipeline solo lee el repo (typecheck+test+lint+build, sin escritura).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit; el smoke de integración se salta sin DATABASE_URL)
        run: npm test

      - name: "Lint (gate duro: rechaza errores nuevos; react-hooks quedan como warning)"
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # next build fija NEXT_PHASE=phase-production-build, así que el fail-fast de
          # BETTER_AUTH_SECRET se omite. Las páginas son dinámicas (no tocan la BD en build).
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # El service container expone el 5432 estándar, no el 55432 del Compose local.
      E2E_PG_HOST: 127.0.0.1
      E2E_PG_PORT: "5432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: "Preparar la BD de E2E (crea ambas bases, migra y siembra)"
        run: npm run e2e:db:reset

      # OJO: este paso NO debe exportar DATABASE_URL. Playwright se lo pasa al
      # servidor Next por el bloque webServer.env de playwright.config.ts. Si se
      # exportara aquí, auth.smoke.test.ts dejaría de saltarse en el job de tests.
      - name: E2E
        run: npx playwright test

      - name: Subir el reporte al fallar
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
