# Motor Postgres para los tests E2E. Solo levanta el servidor: las dos bases
# (salestracker_e2e y zoho_hub_e2e) las crea e2e/db/reset.mjs, para que el mismo
# script sirva aqui y en el service container de CI, sin logica duplicada.
services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: salestracker-postgres-e2e
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Puerto no estandar a proposito, para no chocar con un Postgres local.
      # Configurable via E2E_PG_PORT porque 55432 puede estar ocupado por otro
      # proyecto de la misma maquina; e2e/db/config.mjs y playwright.config.ts
      # leen esa misma variable, con el mismo valor por defecto.
      # Solo en loopback (INFRA-073): con credenciales triviales, no debe quedar
      # expuesto en la red de la máquina.
      - "127.0.0.1:${E2E_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
